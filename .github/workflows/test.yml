name: PADI Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  ELIXIR_VERSION: 1.15.0
  OTP_VERSION: 26.0

jobs:
  # ============================================================================
  # Build & Test
  # ============================================================================
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-padi-${{ hashFiles('**/mix.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-padi-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile NIFs
        run: |
          mix rustler.crates --all --release

      - name: Copy NIFs to priv/native
        run: |
          mkdir -p priv/native
          cp native/*/target/release/lib*.so priv/native/ || echo "No NIFs found to copy"

      - name: Compile project
        run: mix compile

      - name: Run tests
        run: mix test

      - name: Check formatting
        run: mix format --check-formatted
        continue-on-error: true

  # ============================================================================
  # NIF Compilation Test
  # ============================================================================
  nif_build:
    name: Build Native NIFs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nif: [ladypadi, treepadi, vectorpadi]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/${{ matrix.nif }}/target
          key: ${{ runner.os }}-rust-${{ matrix.nif }}-${{ hashFiles('native/${{ matrix.nif }}/Cargo.toml') }}

      - name: Build ${{ matrix.nif }}
        working-directory: ./native/${{ matrix.nif }}
        run: cargo build --release

      - name: Run NIF tests
        working-directory: ./native/${{ matrix.nif }}
        run: cargo test --release
        continue-on-error: true

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run security audit
        run: mix deps audit
        continue-on-error: true

  # ============================================================================
  # Documentation Check
  # ============================================================================
  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ -f "README.md" ]; then
            echo "✅ README.md exists"
          else
            echo "❌ README.md missing"
            exit 1
          fi

      - name: Check Getting Started guide
        run: |
          if [ -f "docs/GETTING_STARTED.md" ]; then
            echo "✅ GETTING_STARTED.md exists"
          else
            echo "❌ GETTING_STARTED.md missing"
            exit 1
          fi

      - name: Check paper references
        run: |
          if grep -q "docs/papers/paper1" README.md && grep -q "docs/papers/paper2" README.md; then
            echo "✅ Paper references found in README"
          else
            echo "❌ Missing paper references"
            exit 1
          fi

  # ============================================================================
  # Test Summary
  # ============================================================================
  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build_and_test, nif_build, security, documentation]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# PADI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build and Test: ${{ needs.build_and_test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- NIF Build: ${{ needs.nif_build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ${{ needs.documentation.result }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          echo "git clone https://github.com/haimiyahya/padi.git" >> $GITHUB_STEP_SUMMARY
          echo "cd padi" >> $GITHUB_STEP_SUMMARY
          echo "mix deps.get" >> $GITHUB_STEP_SUMMARY
          echo "mix rustler.crates --all --release" >> $GITHUB_STEP_SUMMARY
          echo "mix test" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          if [ "${{ needs.build_and_test.result }}" != "success" ]; then
            echo "❌ Build and test failed"
            exit 1
          else
            echo "✅ All critical tests passed"
          fi
